name: adapter-rocks

on:
  workflow_dispatch:
    inputs:
      skip_commit:
        description: "Skip commit results"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_commit:
        type: boolean
        default: false

jobs:
  run-benchmark:
    strategy:
      max-parallel: 4
      matrix:
        include:
          - ver: "bun"
            os: "ubuntu-latest"
          - ver: "24"
            os: "ubuntu-latest"
          - ver: "22"
            os: "ubuntu-latest"
          - ver: "20"
            os: "ubuntu-latest"

    uses: ./.github/workflows/run-single.yml
    with:
      opts: '["./valthera-rocks-test-$$"]'
      adapter: "rocks"
      ver: ${{ matrix.ver }}
      os: ${{ matrix.os }}
    secrets: inherit

  commit-results:
    needs: run-benchmark
    if: ${{ github.event.inputs.skip_commit != 'true' }}
    uses: ./.github/workflows/commit-results.yml
    with:
      adapter: "rocks"
    secrets: inherit
