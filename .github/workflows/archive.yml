name: Archive ValtheraDB repos

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repos=$(gh repo list wxn0brP --limit 500 --json name \
            --jq '[.[].name | select(startswith("ValtheraDB") and . != "ValtheraDB-archive")]')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    if: needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Checkout archive repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch source default branch and push as <repo>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: wxn0brP/${{ matrix.repo }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          default_branch=$(gh api "repos/${SOURCE}" --jq '.default_branch')
          echo "Source: ${SOURCE}, default branch: ${default_branch}"

          git fetch --no-tags "https://github.com/${SOURCE}.git" \
            "+refs/heads/${default_branch}:refs/heads/_tmp_${TARGET}"

          source_sha=$(git rev-parse "_tmp_${TARGET}")

          if git rev-parse "origin/${TARGET}" >/dev/null 2>&1; then
            last_synced=$(git log -1 --format=%B "origin/${TARGET}" \
              | grep -oP 'Source-commit: \K[a-f0-9]+' || true)
            if [ "${source_sha}" = "${last_synced}" ]; then
              echo "No new commits in ${SOURCE}, skipping sync"
              exit 0
            fi
          fi

          git checkout "_tmp_${TARGET}"

          if [ -d .github/workflows ]; then
            git rm -rf .github/workflows
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "chore: archive sync

          Source-commit: ${source_sha}"

          git push origin "HEAD:refs/heads/${TARGET}" --force
