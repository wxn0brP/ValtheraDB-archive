name: adapter-postgresql

on:
  workflow_dispatch:
    inputs:
      skip_commit:
        description: "Skip commit results"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_commit:
        type: boolean
        default: false

jobs:
  run-benchmark:
    strategy:
      max-parallel: 4
      matrix:
        include:
          - ver: "bun"
            os: "ubuntu-latest"
          - ver: "24"
            os: "ubuntu-latest"
          - ver: "22"
            os: "ubuntu-latest"
          - ver: "20"
            os: "ubuntu-latest"

    uses: ./.github/workflows/run-single.yml
    with:
      opts: '["postgres://postgres:postgres@127.0.0.1:5432/valthera", {"mode": "lazy"}]'
      adapter: "postgresql"
      ver: ${{ matrix.ver }}
      os: ${{ matrix.os }}
      install: "pg"
      setup: |
        docker run -d --name valthera-postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=valthera \
          -p 5432:5432 postgres:17-alpine
        for i in {1..30}; do
          if docker exec valthera-postgres pg_isready -U postgres -d valthera; then
            exit 0
          fi
          sleep 2
        done
        docker logs valthera-postgres
        exit 1
    secrets: inherit

  commit-results:
    needs: run-benchmark
    if: ${{ github.event.inputs.skip_commit != 'true' }}
    uses: ./.github/workflows/commit-results.yml
    with:
      adapter: "postgresql"
    secrets: inherit
