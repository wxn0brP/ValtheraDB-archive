name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install

      - name: Build Node output
        run: bun run build

      - name: Smoke test Node build
        run: node dist/local/index.js -h

      - name: Set version
        run: |
          # 0.yyyymmdd.hhmm, leading zeros in the last segment are dropped
          # because semver forbids numeric identifiers like 0905.
          VERSION="0.$(date -u +%Y%m%d).$((10#$(date -u +%H%M)))"
          npm pkg set version="$VERSION"
          echo "Publishing $VERSION"

      - name: Publish to npm
        run: npm publish --access public
