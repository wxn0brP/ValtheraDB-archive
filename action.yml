name: "ValtheraDB E2E"
description: "Run E2E compliance tests against a ValtheraDB adapter"

inputs:
  adapter-path:
    description: "Path to the adapter file (default export returning ActionsBase)"
    required: false
    default: "./valthera-e2e/index.ts"
  runtime:
    description: "Runtime used to run the E2E suite: 'bun' or 'node'"
    required: false
    default: "bun"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        repository: wxn0brP/valtheraDB-e2e
        ref: master
        path: __e2e__

    - if: inputs.runtime == 'bun'
      run: |
        cd __e2e__
        bun install
        bun src/index.ts "${{ github.workspace }}/${{ inputs.adapter-path }}"
      shell: bash

    - if: inputs.runtime == 'node'
      run: |
        cd __e2e__
        npm install --no-audit --no-fund
        npm run build
        node dist/node.js "${{ github.workspace }}/${{ inputs.adapter-path }}"
      shell: bash

    - if: inputs.runtime != 'bun' && inputs.runtime != 'node'
      run: |
        echo "Invalid runtime '${{ inputs.runtime }}'. Allowed values: bun, node"
        exit 1
      shell: bash
